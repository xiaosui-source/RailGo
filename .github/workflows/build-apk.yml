name: Build RailGo APK

# 离线打包：用DCloud官方SDK + 源码编译的www资源，Gradle编译出APK
# 和云打包一模一样，不依赖DCloud云打包服务

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK (离线打包)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 设置 JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 设置 Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'

      - name: 下载离线SDK并编译APK
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
        run: |
          bash offline-pkg/build.sh

      - name: 上传APK
        uses: actions/upload-artifact@v4
        with:
          name: RailGo-APK
          path: RailGo-2.0.4.apk
          if-no-files-found: error
