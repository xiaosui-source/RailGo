name: Build RailGo APK

# RailGo uniapp (Vue3) GitHub Actions 编译工作流
# 使用 HBuilderX CLI 云端打包生成 Android APK
#
# 注意：本配置将 DCloud 账号凭据写死在文件中。
# 若仓库为公开仓库，任何人都可见此凭据，请务必知晓该安全风险！

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

env:
  # DCloud 账号凭据（写死）
  DCLOUD_USERNAME: "3928086165@qq.com"
  DCLOUD_PASSWORD: "zhc20111204"
  # 云打包 AppKey（HBuilderX 云打包必需）
  DCLOUD_APPKEY: "848cdaafa5cfc97987dba6641f7cb403"

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    container:
      image: dcloudio/hbuilderx-cli:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 显示工程信息
        run: |
          echo "工程根目录: $(pwd)"
          cat package.json 2>/dev/null | head -10 || echo "无package.json"

      - name: 配置并检查 AppKey
        run: |
          echo "AppKey: ${DCLOUD_APPKEY:0:6}****${DCLOUD_APPKEY: -4}"
          echo "账号: ${DCLOUD_USERNAME}"
          test -n "$DCLOUD_APPKEY" && echo "AppKey 已配置"

      - name: DCloud CLI 登录
        run: |
          # HBuilderX CLI 通过登录鉴权后进行云打包
          cli login --username "$DCLOUD_USERNAME" --password "$DCLOUD_PASSWORD" 2>&1 | tail -20 || \
            echo "cli login 可能为交互式, 继续尝试 publish"

      - name: HBuilderX 云打包 Android APK
        run: |
          cli publish --platform APP --android packinfo --project . \
            --appkey "$DCLOUD_APPKEY" 2>&1 | tail -50 || {
            echo "::error::云打包可能失败, 检查账号与AppKey"
            exit 1
          }

      - name: 查找 APK
        run: |
          APK=$(find . -name "*.apk" -not -path "*node_modules*" 2>/dev/null | head -1)
          if [ -n "$APK" ]; then
            mkdir -p artifact
            cp "$APK" artifact/RailGo.apk
            ls -lh artifact/
          else
            echo "未找到 APK"
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RailGo-APK
          path: artifact/*.apk
          if-no-files-found: error
