name: Build RailGo APK

# RailGo uniapp (Vue3) GitHub Actions 编译工作流
# 使用 HBuilderX Linux 版 CLI 云端打包生成 Android APK
#
# HBuilderX Linux 官方下载地址（可更换版本号）:
#   https://download1.dcloud.net.cn/download/HBuilderX.<version>.linux_x64.full.tar.gz

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

env:
  # DCloud 账号（用于 cli login，云端打包自动获取 AppKey）
  DCLOUD_USERNAME: "3928086165@qq.com"
  DCLOUD_PASSWORD: "zhc20111204"
  # HBuilderX Linux 完整版下载地址
  HBX_URL: "https://download1.dcloud.net.cn/download/HBuilderX.5.24.2026081301.linux_x64.full.tar.gz"

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 120      # HBuilderX 下载+打包耗时较长
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 下载 HBuilderX (Linux)
        run: |
          echo "下载 HBuilderX Linux 完整版 (~1.8GB)..."
          curl -L -o /tmp/hbx.tar.gz "$HBX_URL" -# --retry 3
          ls -lh /tmp/hbx.tar.gz

      - name: 解压 HBuilderX
        run: |
          # 解压到 /opt（tar 包内含 HBuilderX 顶层目录）
          tar -xzf /tmp/hbx.tar.gz -C /opt
          echo "=== 解压后 /opt 顶层 ==="
          ls /opt/
          echo "=== 磁盘占用 ==="
          du -sh /opt/HBuilderX 2>/dev/null || du -sh /opt/*
          echo "=== 查找 HBuilderX 主目录 ==="
          HBX=$(find /opt / -maxdepth 4 -type d -name "HBuilderX" 2>/dev/null | head -1)
          echo "HBuilderX 目录: $HBX"

      - name: 定位 HBuilderX 根目录 cli 并检查
        run: |
          HBX="/opt/HBuilderX"
          echo "HBuilderX 目录: $HBX"
          echo "=== 根目录下 cli 相关文件 ==="
          ls -la "$HBX" | grep -iE '^.*cli' || ls "$HBX" | head -40
          echo "=== 查找真正的 cli 可执行文件(排插件) ==="
          # HBuilderX 的 CLI 位于根目录 cli，排除 plugins/node_modules
          CLI=""
          if [ -f "$HBX/cli" ]; then CLI="$HBX/cli"; fi
          if [ -z "$CLI" ]; then
            CLI=$(find "$HBX" -maxdepth 2 -name "cli" ! -path "*/plugins/*" ! -path "*/node_modules/*" -type f 2>/dev/null | head -1)
          fi
          echo "CLI 位于: ${CLI:-未找到,列出根目录}"
          echo "CLI_PATH=$CLI" >> $GITHUB_ENV
          if [ -n "$CLI" ]; then chmod +x "$CLI"; echo "--- cli 版本 ---"; "$CLI" version 2>&1 | head -5 || true; fi

      - name: DCloud CLI 登录
        run: |
          sleep 5
          "$CLI_PATH" login --username "$DCLOUD_USERNAME" --password "$DCLOUD_PASSWORD" 2>&1 | tail -30 || {
            echo "::warning::cli login 输出, 尝试继续"
          }

      - name: 安装项目 npm 依赖
        run: |
          cd "$GITHUB_WORKSPACE"
          if [ -f package.json ]; then
            npm install --legacy-peer-deps 2>&1 | tail -10
          fi

      - name: 编译 uni-app 应用资源 (www)
        run: |
          cd "$GITHUB_WORKSPACE"
          P=$(pwd)
          echo "工程目录: $P, manifest appid: $(grep -oE '\"appid\"\s*:\s*\"[^\"]*\"' manifest.json | head -1)"
          # 清理旧产物
          rm -rf "$P/unpackage"
          echo "=== 运行 HBuilderX cli publish (会自动先编译 uniapp 生成 www) ==="
          "$CLI_PATH" publish --project "$P" --platform APP --android.packgtype release 2>&1 | tee /tmp/publish.log | tail -80
          echo "=== 编译产物检查 ==="
          find "$P/unpackage" -maxdepth 4 -type d 2>/dev/null | head -20
          WWW=$(find "$P/unpackage" -type d -path "*dist/build/app/www" 2>/dev/null | head -1)
          echo "www 目录: ${WWW:-<<未生成>>}"
          if [ -n "$WWW" ]; then
            echo "www 文件数: $(find "$WWW" -type f | wc -l)"
            ls "$WWW" | head
          else
            echo "::error::www 资源未生成！请查看上方日志"
            echo "publish 日志最后30行:"
            tail -30 /tmp/publish.log
          fi

      - name: 确认并上传 www (若 publish 未自动打包)
        run: |
          cd "$GITHUB_WORKSPACE"
          WWW=$(find "$PWD/unpackage" -type d -path "*dist/build/app/www" 2>/dev/null | head -1)
          echo "www: ${WWW:-无}"
          # 若 www 已生成但尚未云打包，再次 publish（现在有资源了）
          if [ -n "$WWW" ]; then
            APKS=$(find . -name "*.apk" 2>/dev/null)
            if [ -z "$APKS" ]; then
              echo "www 已生成但无 APK, 再次 publish 触发云端打包..."
              "$CLI_PATH" publish --project "$PWD" --platform APP --android.packgtype release 2>&1 | tail -50
            fi
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RailGo-APK
          path: artifact/*.apk
          if-no-files-found: warn
