name: Build RailGo APK

# RailGo uniapp (Vue3) GitHub Actions 编译工作流
# 使用 HBuilderX Linux 版 CLI 云端打包生成 Android APK
#
# HBuilderX Linux 官方下载地址（可更换版本号）:
#   https://download1.dcloud.net.cn/download/HBuilderX.<version>.linux_x64.full.tar.gz

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

env:
  # DCloud 账号（用于 cli login，云端打包自动获取 AppKey）
  DCLOUD_USERNAME: "3928086165@qq.com"
  DCLOUD_PASSWORD: "zhc20111204"
  # HBuilderX Linux 完整版下载地址
  HBX_URL: "https://download1.dcloud.net.cn/download/HBuilderX.5.24.2026081301.linux_x64.full.tar.gz"

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 120      # HBuilderX 下载+打包耗时较长
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 下载 HBuilderX (Linux)
        run: |
          echo "下载 HBuilderX Linux 完整版 (~1.8GB)..."
          curl -L -o /tmp/hbx.tar.gz "$HBX_URL" -# --retry 3
          ls -lh /tmp/hbx.tar.gz

      - name: 解压 HBuilderX
        run: |
          mkdir -p /opt/hbx
          tar -xzf /tmp/hbx.tar.gz -C /opt/hbx
          echo "解压完成, HBuilderX 目录:"
          ls /opt/hbx/
          find /opt/hbx -name "cli" -type f 2>/dev/null | head

      - name: 定位 cli 并初始化
        run: |
          CLI=$(find /opt/hbx -name "cli" -type f | head -1)
          echo "CLI 位于: $CLI"
          echo "CLI_PATH=$CLI" >> $GITHUB_ENV
          chmod +x "$CLI" || true
          "$CLI" version 2>&1 | head -5 || echo "(cli version 非必需)"

      - name: DCloud CLI 登录
        run: |
          "$CLI_PATH" login --username "$DCLOUD_USERNAME" --password "$DCLOUD_PASSWORD" 2>&1 | tail -25 || {
            echo "::warning::cli login 输出, 尝试继续"
          }

      - name: HBuilderX 云打包 Android APK
        run: |
          echo "工程目录: $(pwd)"
          P=$(pwd)
          # 使用测试证书云打包(免密), 云端打包自动获取AppKey
          "$CLI_PATH" publish --project "$P" --platform APP \
            --android.packgtype release 2>&1 | tail -60
          EXIT=${PIPESTATUS[0]}
          echo "publish 退出码: $EXIT"
          if [ "$EXIT" != "0" ]; then
            echo "::warning::首次publish失败, 尝试备选参数..."
            "$CLI_PATH" publish --project "$P" --platform app 2>&1 | tail -30 || echo "备选也失败"
          fi

      - name: 查找 APK 产物
        run: |
          APK=$(find . -name "*.apk" -not -path "*node_modules*" 2>/dev/null | head -1)
          if [ -n "$APK" ]; then
            mkdir -p artifact
            cp "$APK" artifact/RailGo.apk
            echo "APK: $APK ($(stat -c%s "$APK") bytes)"
            ls -lh artifact/
          else
            echo "未在仓库目录找到 APK, 尝试全局搜索..."
            APK2=$(find / -name "*.apk" 2>/dev/null | grep -iE 'railgo|__UNI|app-release|app' | head -1)
            [ -n "$APK2" ] && { mkdir -p artifact; cp "$APK2" artifact/RailGo.apk; echo "找到: $APK2"; }
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RailGo-APK
          path: artifact/*.apk
          if-no-files-found: warn
