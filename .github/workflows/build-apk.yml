name: Build RailGo APK

# RailGo uniapp (Vue3) GitHub Actions 编译工作流
# 使用 HBuilderX CLI 云端打包生成 Android APK
#
# 使用前必须配置以下 GitHub Secrets（Settings → Secrets and variables → Actions）:
#   DCLOUD_USERNAME   DCloud 开发者账号（邮箱）
#   DCLOUD_PASSWORD   DCloud 开发者账号密码
#   DCLOUD_APPKEY     在 HBuilderX 中 发行→原生App-云打包 获取的应用AppKey

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:          # 手动触发

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    container:
      image: dcloudio/hbuilderx-cli:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 显示工程信息
        run: |
          echo "工程根目录: $(pwd)"
          ls -la
          cat package.json 2>/dev/null | head -20 || echo "(无 package.json)"

      - name: 安装 node 依赖
        run: |
          if [ -f package.json ]; then
            npm install 2>&1 | tail -5 || echo "依赖安装非必需(由HBuilderX内部处理)"
          fi

      - name: 配置 DCloud 账号环境
        env:
          DCLOUD_USERNAME: ${{ secrets.DCLOUD_USERNAME }}
          DCLOUD_PASSWORD: ${{ secrets.DCLOUD_PASSWORD }}
          DCLOUD_APPKEY: ${{ secrets.DCLOUD_APPKEY }}
        run: |
          echo "DCloud账号: ${DCLOUD_USERNAME:0:6}***"
          echo "AppKey: ${DCLOUD_APPKEY:0:6}***"

      - name: HBuilderX 云打包 Android APK
        run: |
          cli publish --platform APP --project . 2>&1 | tail -40 || {
            echo "::warning::HBuilderX 云打包退出码非0，请检查 DCLOUD_APPKEY 与账号配置"
            exit 1
          }

      - name: 查找 APK
        run: |
          echo "搜索 APK..."
          APK=$(find . -name "*.apk" -not -path "*node_modules*" 2>/dev/null | head -1)
          if [ -n "$APK" ]; then
            echo "发现: $APK"
            mkdir -p artifact
            cp "$APK" artifact/RailGo.apk
            ls -lh artifact/
          else
            echo "未找到 APK，可能云打包未产出或失败"
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RailGo-APK
          path: artifact/*.apk
          if-no-files-found: error
