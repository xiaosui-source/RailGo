name: Build RailGo APK

# 全源码编译 + 官方离线SDK打包
# 1. clone 官方源码 RailGoApps/RailGo
# 2. uniapp CLI 编译生成 www
# 3. 下载 DCloud 官方离线SDK
# 4. Gradle 离线打包出 APK (和云打包一致, 包名/图标/名称/版本按原版)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 设置 JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 设置 Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: 设置 Android SDK
        uses: android-actions/setup-android@v3

      - name: 全源码编译 + 离线打包
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
        timeout-minutes: 50
        run: |
          bash offline-pkg/build.sh

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: RailGo-APK
          path: RailGo.apk
          if-no-files-found: error
